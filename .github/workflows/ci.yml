name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...

  release:
    name: Build release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build desktop binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          build() {
            local os="$1" arch="$2" name="$3"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "dist/$name" .
          }
          build windows amd64 Specter-Virtual-Host-Windows-x64.exe
          build linux amd64 Specter-Virtual-Host-Linux-x64
          build darwin amd64 Specter-Virtual-Host-macOS-x64
          build darwin arm64 Specter-Virtual-Host-macOS-arm64
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
